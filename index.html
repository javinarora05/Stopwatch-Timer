<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="A browser stopwatch and timer practice project built with vanilla JavaScript.">
  <meta name="author" content="Javin Arora">
  <meta name="theme-color" content="#111827">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Stopwatch Timer">
  <meta property="og:description" content="Start, stop, reset and log elapsed time in a simple browser stopwatch.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Stopwatch Timer">
  <meta name="twitter:description" content="A simple browser stopwatch built with vanilla JavaScript.">
<title>Stopwatch Timer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <script src="script.js" defer></script>

  <div class="wrapper">
    <div class="stopwatch">

      <div class="display" id="display">0</div>

      <div class="buttons">
        <button class="btn" id="start">Start</button>
        <button class="btn" id="reset">Reset</button>

        <button class="btn" id="stop">Stop</button>
        <button class="btn" id="getTime">getTime</button>

        <button class="btn full" id="clearTime">clearTime</button>
      </div>

      
      <div class="message" id="message"></div>

    </div>
  </div>

</body>
</html>
